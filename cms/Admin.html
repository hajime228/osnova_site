<!doctype html>
<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--red:#b91f19;--ink:#1c1a18;--muted:#736d67;--line:#e7e1db;--bg:#f7f4f0}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.login{max-width:430px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(40,30,24,.09)}h1{margin:0 0 8px;font-size:27px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #dcd5ce;border-radius:12px;padding:12px;background:#fff}.field textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer}.btn-primary{background:var(--red);color:#fff}.btn-soft{background:#eee8e2}.app{display:none}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 22px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}.top strong{font-size:18px}.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 64px)}.side{border-right:1px solid var(--line);background:#fff;padding:18px}.side-actions{display:flex;gap:8px;margin-bottom:14px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:13px;cursor:pointer}.item:hover,.item.active{border-color:#c94a44;background:#fff8f7}.item b{display:block}.item small{color:var(--muted)}.editor{padding:24px;max-width:1000px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px}.toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.content{min-height:330px;background:#fff;border:1px solid #dcd5ce;border-radius:12px;padding:16px;outline:none}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:14px}.uploadbox{background:#fff;border:1px dashed #cfc5bc;border-radius:14px;padding:15px}.media-list{display:grid;gap:8px;margin-top:10px}.media-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;background:#f7f4f0;border-radius:10px}.media-row button{border:0;background:transparent;color:#b91f19;cursor:pointer}.savebar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%)}.status{margin-right:auto;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.grid2,.uploads{grid-template-columns:1fr}.editor{padding:16px}.top{padding:11px 14px}}
</style></head><body>
<div class="login" id="login"><h1>Редактор статей</h1><p class="muted">Введите ключ автора, выданный при настройке.</p><div class="field"><label>Ключ доступа</label><input id="key" type="password" autocomplete="current-password"></div><button class="btn btn-primary" onclick="login()">Войти</button><p id="loginStatus" class="muted"></p></div>
<div class="app" id="app"><header class="top"><strong>ЦОР ОСНОВА · Статьи</strong><span><a id="sheetLink" target="_blank">Таблица</a> · <a id="folderLink" target="_blank">Медиа</a></span></header><div class="layout"><aside class="side"><div class="side-actions"><button class="btn btn-primary" onclick="newArticle()">+ Новая</button><button class="btn btn-soft" onclick="loadList()">Обновить</button></div><div class="list" id="list"></div></aside><main class="editor"><div class="grid2"><div class="field"><label>Заголовок</label><input id="title" oninput="autoSlug()"></div><div class="field"><label>Адрес статьи (slug)</label><input id="slug"></div><div class="field"><label>Категория</label><input id="category" value="Обучение"></div><div class="field"><label>Статус</label><select id="status"><option>Черновик</option><option>Опубликовано</option></select></div><div class="field"><label>Дата</label><input id="date" type="date"></div><div class="field"><label>Время чтения</label><input id="readTime" placeholder="Рассчитается автоматически"></div></div><div class="field"><label>Краткое описание для карточки</label><textarea id="excerpt"></textarea></div><div class="field"><label>Текст статьи</label><div class="toolbar"><button onclick="cmd('bold')"><b>Ж</b></button><button onclick="cmd('italic')"><i>К</i></button><button onclick="block('h2')">Заголовок</button><button onclick="block('p')">Абзац</button><button onclick="cmd('insertUnorderedList')">Список</button><button onclick="addLink()">Ссылка</button><button onclick="cmd('removeFormat')">Очистить</button></div><div id="content" class="content" contenteditable="true"></div></div><div class="uploads"><div class="uploadbox"><b>Обложка</b><p class="muted">JPG, PNG или WebP.</p><input type="file" accept="image/*" onchange="uploadCover(this)"><div id="coverInfo" class="media-list"></div></div><div class="uploadbox"><b>Фотографии и файлы</b><p class="muted">Можно добавлять фото, PDF, презентации PPT/PPTX и другие материалы.</p><input type="file" multiple onchange="uploadFiles(this)"><div id="mediaList" class="media-list"></div></div></div><div class="savebar"><span class="status" id="statusText"></span><button class="btn btn-soft" onclick="removeArticle()">Удалить</button><button class="btn btn-primary" onclick="save()">Сохранить</button></div></main></div></div>
<script>
let KEY='',current={id:'',gallery:[],attachments:[],image:''},articles=[];
const $=id=>document.getElementById(id); const val=id=>$(id).value.trim();
function login(){KEY=$('key').value.trim();$('loginStatus').textContent='Проверяем…';google.script.run.withSuccessHandler(ok=>{if(!ok){$('loginStatus').textContent='Неверный ключ';return}$('login').style.display='none';$('app').style.display='block';google.script.run.withSuccessHandler(info=>{$('sheetLink').href=info.sheetUrl;$('folderLink').href=info.folderUrl}).getCmsInfo(KEY);loadList();newArticle()}).checkKey(KEY)}
function loadList(){google.script.run.withSuccessHandler(rows=>{articles=rows||[];$('list').innerHTML=articles.map(a=>`<div class="item" onclick="edit('${a.id}')"><b>${e(a.title||'Без названия')}</b><small>${e(a.status)} · ${e(a.date)}</small></div>`).join('')||'<p class="muted">Статей пока нет.</p>'}).withFailureHandler(showErr).listAdminArticles(KEY)}
function newArticle(){current={id:'',gallery:[],attachments:[],image:''};['title','slug','excerpt','readTime'].forEach(x=>$(x).value='');$('category').value='Обучение';$('status').value='Черновик';$('date').value=new Date().toISOString().slice(0,10);$('content').innerHTML='';renderMedia();}
function edit(id){const a=articles.find(x=>x.id===id);if(!a)return;current={...a,gallery:json(a.gallery),attachments:json(a.attachments)};['title','slug','category','status','date','excerpt','readTime'].forEach(x=>$(x).value=a[x]||'');$('content').innerHTML=a.content||'';renderMedia()}
function save(){const data={...current,title:val('title'),slug:val('slug'),category:val('category'),status:val('status'),date:val('date'),excerpt:val('excerpt'),readTime:val('readTime'),content:$('content').innerHTML,image:current.image||'',gallery:JSON.stringify(current.gallery||[]),attachments:JSON.stringify(current.attachments||[])};if(!data.title){show('Введите заголовок');return}show('Сохраняем…');google.script.run.withSuccessHandler(r=>{current.id=r.id;show('Сохранено');loadList()}).withFailureHandler(showErr).saveArticle(KEY,data)}
function removeArticle(){if(!current.id||!confirm('Удалить статью?'))return;google.script.run.withSuccessHandler(()=>{newArticle();loadList();show('Удалено')}).withFailureHandler(showErr).deleteArticle(KEY,current.id)}
function uploadCover(input){const f=input.files[0];if(!f)return;uploadOne(f,res=>{current.image=res.url;renderMedia()});input.value=''}
function uploadFiles(input){[...input.files].forEach(f=>uploadOne(f,res=>{const item={name:res.name,type:res.type,url:res.url,description:''};if(String(res.type).startsWith('image/'))current.gallery.push(item);else current.attachments.push(item);renderMedia()}));input.value=''}
function uploadOne(file,done){show('Загружаем '+file.name+'…');const r=new FileReader();r.onload=()=>google.script.run.withSuccessHandler(res=>{show('Файл загружен');done(res)}).withFailureHandler(showErr).uploadMedia(KEY,{name:file.name,type:file.type,base64:String(r.result).split(',')[1]});r.readAsDataURL(file)}
function renderMedia(){$('coverInfo').innerHTML=current.image?`<div class="media-row"><span>Обложка загружена</span><button onclick="current.image='';renderMedia()">Удалить</button></div>`:'';const g=(current.gallery||[]).map((x,i)=>`<div class="media-row"><span>Фото: ${e(x.name)}</span><button onclick="current.gallery.splice(${i},1);renderMedia()">Удалить</button></div>`);const a=(current.attachments||[]).map((x,i)=>`<div class="media-row"><span>Файл: ${e(x.name)}</span><button onclick="current.attachments.splice(${i},1);renderMedia()">Удалить</button></div>`);$('mediaList').innerHTML=[...g,...a].join('')}
function cmd(c){document.execCommand(c,false,null);$('content').focus()}function block(tag){document.execCommand('formatBlock',false,tag);$('content').focus()}function addLink(){const u=prompt('Ссылка:');if(u)document.execCommand('createLink',false,u)}
function autoSlug(){if(current.id||$('slug').dataset.touched)return;$('slug').value=translit(val('title'))}$('slug').addEventListener('input',()=>$('slug').dataset.touched='1');
function translit(s){const m={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};return s.toLowerCase().split('').map(c=>m[c]??c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function json(v){try{return JSON.parse(v||'[]')}catch{return[]}}function e(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(t){$('statusText').textContent=t}function showErr(err){show('Ошибка: '+(err.message||err))}
</script></body></html>
